name: Deploy Jekyll site

on:
  push:
    branches: ["**"]      # Build on every push to any branch
  workflow_dispatch:      # Enable manual triggers via the "Run workflow" button
    inputs:
      skip_html_validation:
        description: 'skip HTML validation?'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: 'Force deployment on manual trigger?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Load full git history for accurate "last modified" timestamps

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          version-file: '.ruby-version'
          bundler-cache: true # Caches gems to speed up future builds

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: validate EUR
        run: bundle exec ruby exclude/validate-eur.rb

      - name: Validate HTML
        if: ${{ github.event.inputs.skip_html_validation != 'true' }}
        run: bundle exec ruby exclude/validate-html.rb

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    # Deploys automatically on 'main' push OR on manual trigger with 'force_deploy' checked
    if: |
      github.ref == 'refs/heads/main' && github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
